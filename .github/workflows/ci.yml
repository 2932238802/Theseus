name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (fmt / clippy / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --all-targets
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit（依赖漏洞）
        run: cargo audit

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json
      - run: npm ci
      - name: npm run build（含 vue-tsc 类型检查）
        run: npm run build
      - name: npm audit（仅生产依赖，高危及以上失败）
        run: npm audit --omit=dev --audit-level=high

  scripts:
    name: shell scripts (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.sh deploy/scripts/*.sh backend-rust/scripts/*.sh)
          for file in "${files[@]}"; do
            bash -n "$file"
            echo "ok $file"
          done
