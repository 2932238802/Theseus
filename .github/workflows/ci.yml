name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (fmt / clippy / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --all-targets
      - name: Verify Dockerfile bin list
        run: |
          set -euo pipefail
          # 依赖层用空入口占位；新增 bin 时 Dockerfile 必须同步占位与产物复制。
          for file in src/bin/*.rs; do
            bin=$(basename "$file" .rs)
            grep -q "src/bin/${bin}.rs" Dockerfile \
              || { echo "Dockerfile 缺少 ${bin} 的空入口" >&2; exit 1; }
            grep -q "target/release/${bin}" Dockerfile \
              || { echo "Dockerfile 缺少 ${bin} 的产物复制" >&2; exit 1; }
          done
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Verify RSA is not enabled on any target
        run: |
          set -euo pipefail
          # SQLx's optional MySQL backend retains rsa in Cargo.lock even though
          # this application enables PostgreSQL only. Fail if it becomes active.
          dependents=$(cargo tree --locked --target all --invert rsa --prefix none)
          if [[ -n "$dependents" ]]; then
            printf '%s\n' "$dependents"
            echo 'RSA is now active; remove the advisory exception and reassess.' >&2
            exit 1
          fi
      - name: cargo audit（依赖漏洞）
        # RUSTSEC-2023-0071 has no fix; rsa is an unused SQLx MySQL optional
        # dependency in the lockfile, guarded by the all-target check above.
        run: cargo audit --ignore RUSTSEC-2023-0071

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json
      - run: npm ci
      - name: npm run build（含 vue-tsc 类型检查）
        run: npm run build
      - name: npm audit（仅生产依赖，高危及以上失败）
        run: npm audit --omit=dev --audit-level=high

  scripts:
    name: shell scripts (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.sh deploy/scripts/*.sh deploy/observability/alertmanager/*.sh backend-rust/scripts/*.sh)
          for file in "${files[@]}"; do
            bash -n "$file"
            echo "ok $file"
          done

  load-scripts:
    name: k6 scripts (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --check
        run: node --input-type=module --check < deploy/load/k6-theseus.js

  images:
    name: publish ${{ matrix.image }}
    needs: [backend, frontend, scripts, load-scripts]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend-rust
            target: ""
          - image: lsp
            context: backend-rust
            target: lsp
          - image: frontend
            context: frontend-vue
            target: ""
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image prefix
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 依赖与 registry 都在依赖层，GHA 层缓存可直接复用，无需额外导出 cache mount。
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.prefix }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            CARGO_BUILD_JOBS=2
            VITE_API_BASE_URL=/api
            VITE_SUBMIT_JUDGE_ENABLED=true
          cache-from: type=gha,scope=images-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=images-${{ matrix.image }}
      - name: Deployment reference
        env:
          PREFIX: ${{ steps.image.outputs.prefix }}
          SHA: ${{ github.sha }}
        run: |
          printf '### %s image published\n\n`%s/%s:%s`\n\nManual deploy only; no server was changed.\n' \
            '${{ matrix.image }}' "$PREFIX" '${{ matrix.image }}' "$SHA" >> "$GITHUB_STEP_SUMMARY"
