# Theseus 单机可观测性配置。
# 仅在 docker compose --profile observability 时启动，见 deploy/compose.yaml。

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: theseus

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # API 的 /metrics 只在 Compose 内部网络暴露，抓取不经过公网。
  - job_name: theseus-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:3000

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
