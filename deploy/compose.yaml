name: theseus

# 单机部署：PostgreSQL + Redis + API + 判题 Worker + 防作弊 Worker + 前端 Nginx。
# 使用前：cp .env.example .env 并至少修改 POSTGRES_PASSWORD 与 JWT_SECRET。
# 详细步骤见 doc/2610305_服务器部署方案.md。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-env: &backend-env
  DATABASE_URL: postgres://${POSTGRES_USER:-theseus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-theseus}
  REDIS_URL: redis://redis:6379
  BIND_ADDRESS: 0.0.0.0:3000
  UPLOAD_DIR: /data/uploads

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # 预加载 pg_stat_statements，供 deploy/scripts/pg_stats.sh 采集慢查询。
    # 扩展本身仍需执行一次 CREATE EXTENSION，见脚本 enable 子命令。
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=1000
      - -c
      - pg_stat_statements.track=all
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-theseus}
      POSTGRES_USER: ${POSTGRES_USER:-theseus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 中设置 POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  backend:
    build:
      context: ../backend-rust
      dockerfile: Dockerfile
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
        CARGO_MIRROR: ${CARGO_MIRROR:-}
        APT_MIRROR: ${APT_MIRROR:-}
    image: ${IMAGE_PREFIX:-theseus}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      <<: *backend-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging

  judge-worker:
    image: ${IMAGE_PREFIX:-theseus}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    command: ["/app/judge_worker"]
    env_file: .env
    environment:
      <<: *backend-env
      RUN_WORKER_NAME: ${RUN_WORKER_NAME:-worker-1}
    volumes:
      # Worker 通过宿主机 Docker 启动 runsc 沙箱。
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 90s
    logging: *default-logging

  anticheat-worker:
    image: ${IMAGE_PREFIX:-theseus}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    command: ["/app/anticheat_worker"]
    env_file: .env
    environment:
      <<: *backend-env
      ANTICHEAT_WORKER_NAME: ${ANTICHEAT_WORKER_NAME:-anticheat-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 60s
    logging: *default-logging

  lsp:
    build:
      context: ../backend-rust
      dockerfile: Dockerfile
      target: lsp
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
        CARGO_MIRROR: ${CARGO_MIRROR:-}
        APT_MIRROR: ${APT_MIRROR:-}
    image: ${IMAGE_PREFIX:-theseus}/lsp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      LSP_BIND_ADDRESS: 0.0.0.0:3001
      LSP_MAX_SESSIONS: ${LSP_MAX_SESSIONS:-4}
      RUST_LOG: ${RUST_LOG:-info}
    expose:
      - "3001"
    # 每个会话在 /tmp 下创建临时工作区，无需持久化。
    tmpfs:
      - /tmp:size=256m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  frontend:
    build:
      context: ../frontend-vue
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_SUBMIT_JUDGE_ENABLED: ${VITE_SUBMIT_JUDGE_ENABLED:-false}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    image: ${IMAGE_PREFIX:-theseus}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      # 题面配图直接读宿主机文件：git pull 后即时生效，无需重建前端镜像。
      - ../frontend-vue/public/problem-images:/usr/share/nginx/html/problem-images:ro
    depends_on:
      backend:
        condition: service_healthy
      lsp:
        condition: service_started
    logging: *default-logging

  # ---- 可观测性（可选）----
  # 启用方式：在 deploy/.env 中加入 COMPOSE_PROFILES=observability，
  # 或临时使用 docker compose --profile observability up -d。
  # 三个端口都只绑定本机，公网访问请走 SSH 隧道或自行加反代与鉴权。
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["observability"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    env_file: .env
    environment:
      # 复用后端邮件配置；未设置 ALERT_EMAIL_TO 时不生成 email_configs。
      SMTP_SMARTHOST: ${EMAIL_SMTP_HOST:-}:${EMAIL_SMTP_PORT:-587}
      SMTP_FROM: ${EMAIL_FROM:-}
      SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      SMTP_REQUIRE_TLS: ${EMAIL_SMTP_TLS:-true}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ./observability/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/theseus-overview.json
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  uploads:
  prometheus-data:
  alertmanager-data:
  grafana-data:
